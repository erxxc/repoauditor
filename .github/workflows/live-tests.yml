name: live model tests

on:
  schedule:
    # Weekly manufactured controls.
    - cron: "17 6 * * 2"
    # Monthly bounded independent pre/post pair.
    - cron: "47 6 1 * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Live evaluation scope
        required: true
        default: sentinels-only
        type: choice
        options:
          - sentinels-only
          - live-lightweight
          - bounded-independent
          - cve-positive-pyjwt
          - cve-positive-simple-git
          - cve-positive-reposilite
          - cve-positive-ruby-saml
          - cve-positive-aiohttp
          - cve-positive-aiohttp-continuation
          - detection-sentinels
          - xml-detection-sentinels
          - retrieval-diagnostic

permissions:
  contents: read
  actions: read

jobs:
  live:
    name: live / Anthropic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: live-model-tests
    env:
      REPOAUDITOR_LLM: live
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # actions/cache/restore@v4 is executed from the immutable v4 commit pinned below.
      - name: Restore trusted pinned public snapshots
        id: corpus-cache
        if: >-
          (
            github.event_name == 'workflow_dispatch' &&
            (
              inputs.scope == 'bounded-independent' ||
              inputs.scope == 'cve-positive-pyjwt' ||
              inputs.scope == 'cve-positive-simple-git' ||
              inputs.scope == 'cve-positive-reposilite' ||
              inputs.scope == 'cve-positive-ruby-saml' ||
              inputs.scope == 'cve-positive-aiohttp' ||
              inputs.scope == 'cve-positive-aiohttp-continuation' ||
              inputs.scope == 'retrieval-diagnostic'
            )
          ) ||
          github.event.schedule == '47 6 1 * *'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            tests/fixtures/independent_*/snapshot
            tests/fixtures/anchor_owasp_*/snapshot
            tests/fixtures/acquisition_cve_*/snapshot
          key: public-corpus-v2-${{ runner.os }}-${{ hashFiles('tests/fixtures/materialize_public_corpus.py', 'tests/fixtures/independent_*/expected_findings.json', 'tests/fixtures/anchor_owasp_*/expected_findings.json', 'tests/fixtures/cve_positive_acquisition_cohort.json') }}
      - name: Require a validated corpus cache
        if: >-
          (
            (
              github.event_name == 'workflow_dispatch' &&
              (
                inputs.scope == 'bounded-independent' ||
                inputs.scope == 'cve-positive-pyjwt' ||
                inputs.scope == 'cve-positive-simple-git' ||
                inputs.scope == 'cve-positive-reposilite' ||
                inputs.scope == 'cve-positive-ruby-saml' ||
                inputs.scope == 'cve-positive-aiohttp' ||
                inputs.scope == 'cve-positive-aiohttp-continuation' ||
                inputs.scope == 'retrieval-diagnostic'
              )
            ) ||
            github.event.schedule == '47 6 1 * *'
          ) &&
          steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          echo "No exact validated public-corpus cache exists for this revision." >&2
          echo "Run the 'public corpus cache' workflow before spending live-model budget." >&2
          exit 1
      - name: Verify restored protected holdout before paid execution
        if: >-
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.scope == 'bounded-independent'
          ) ||
          github.event.schedule == '47 6 1 * *'
        run: >-
          python tests/fixtures/audit_corpus_readiness.py
          --require-materialized
          --output corpus-readiness.json
      - name: Verify restored CVE-positive cohort before paid execution
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.scope == 'cve-positive-pyjwt' ||
            inputs.scope == 'cve-positive-simple-git' ||
            inputs.scope == 'cve-positive-reposilite' ||
            inputs.scope == 'cve-positive-ruby-saml' ||
            inputs.scope == 'cve-positive-aiohttp' ||
            inputs.scope == 'cve-positive-aiohttp-continuation'
          )
        run: >-
          python tests/fixtures/audit_corpus_readiness.py
          --require-cve-positive-materialized
          --output corpus-readiness.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - name: Restore frozen aiohttp partial baseline
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.scope == 'cve-positive-aiohttp-continuation'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: live-cve-positive-30383181253
          path: retained-aiohttp-baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30383181253
      - name: Install frozen continuation database
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.scope == 'cve-positive-aiohttp-continuation'
        run: |
          mkdir -p live-cve-positive-data
          cp retained-aiohttp-baseline/live-cve-positive-data/repoauditor.db \
            live-cve-positive-data/repoauditor.db
      - name: Validate frozen continuation before model use
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.scope == 'cve-positive-aiohttp-continuation'
        env:
          PYTHONPATH: tests
        run: >-
          uv run python tests/validate_cve_continuation.py
          --database live-cve-positive-data/repoauditor.db
          --results retained-aiohttp-baseline/live-cve-positive-results.json
          --snapshot
          tests/fixtures/acquisition_cve_aiohttp_cve_2024_23334_pre/snapshot
      - name: Smoke-test restored Juice Shop retrieval
        if: >-
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.scope == 'retrieval-diagnostic'
          )
        env:
          REPOAUDITOR_RETRIEVAL_TRACE_FILES: "1"
        run: >-
          uv run pytest
          tests/test_benchmark_corpus.py::test_materialized_juice_shop_retrieval_index_builds
          -q -o log_cli=true -o log_cli_level=WARNING
      - name: Require the protected live-test secret
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.scope != 'retrieval-diagnostic'
        shell: bash
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "ANTHROPIC_API_KEY is not configured in the live-model-tests environment." >&2
            exit 1
          fi
      - name: Qualify falsification instrument with manufactured controls
        if: >-
          github.event_name != 'workflow_dispatch' ||
          (
            inputs.scope != 'retrieval-diagnostic' &&
            inputs.scope != 'detection-sentinels' &&
            inputs.scope != 'xml-detection-sentinels'
          )
        run: uv run repoauditor qualify-instrument --format json > manufactured-sentinels.json
      - name: Publish manufactured-control result
        if: >-
          always() &&
          (
            github.event_name != 'workflow_dispatch' ||
            (
              inputs.scope != 'retrieval-diagnostic' &&
              inputs.scope != 'detection-sentinels' &&
              inputs.scope != 'xml-detection-sentinels'
            )
          )
        run: |
          echo "## Manufactured falsification controls" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This qualifies only the fixed sentinel cohort, not real-world accuracy." >> "$GITHUB_STEP_SUMMARY"
          if [[ -f manufactured-sentinels.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat manufactured-sentinels.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No structured result was produced; the instrument run is disqualified." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Qualify OWASP archive detection with manufactured controls
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.scope == 'detection-sentinels' ||
            inputs.scope == 'cve-positive-aiohttp' ||
            inputs.scope == 'cve-positive-aiohttp-continuation'
          )
        run: uv run repoauditor qualify-detection --format json > manufactured-detection-sentinels.json
      - name: Retain manufactured detection evidence
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.scope == 'detection-sentinels' ||
            inputs.scope == 'cve-positive-aiohttp' ||
            inputs.scope == 'cve-positive-aiohttp-continuation'
          )
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manufactured-detection-sentinels-${{ github.run_id }}
          path: manufactured-detection-sentinels.json
          retention-days: 30
          if-no-files-found: error
      - name: Qualify OWASP XML parser-differential detection
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.scope == 'xml-detection-sentinels'
        run: >-
          uv run repoauditor qualify-xml-detection --format json
          > manufactured-xml-detection-sentinels.json
      - name: Retain manufactured XML detection evidence
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.scope == 'xml-detection-sentinels'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manufactured-xml-detection-sentinels-${{ github.run_id }}
          path: manufactured-xml-detection-sentinels.json
          retention-days: 30
          if-no-files-found: error
      - name: Run bounded live cohort
        if: >-
          success() &&
          (
            (
              github.event_name == 'workflow_dispatch' &&
              (
                inputs.scope == 'live-lightweight' ||
                inputs.scope == 'bounded-independent'
              )
            ) ||
            github.event.schedule == '47 6 1 * *'
          )
        timeout-minutes: 22
        env:
          REPOAUDITOR_CORPUS_IDS: >-
            ${{
              inputs.scope == 'live-lightweight' &&
              'uat_lightweight_app' ||
              'independent_serialize_javascript_pre,independent_serialize_javascript_post'
            }}
          REPOAUDITOR_UAT_RESULTS: live-corpus-results.json
          REPOAUDITOR_UAT_SCANNER_COVERAGE: not-installed-live-model-only
          REPOAUDITOR_UAT_MAX_BATCHES: "6"
          REPOAUDITOR_UAT_DATA_DIR: live-uat-data
        run: |
          echo "Bounded live cohort: $REPOAUDITOR_CORPUS_IDS"
          echo "Hard evaluation timeout: 20 minutes; at most $REPOAUDITOR_UAT_MAX_BATCHES linked batches per fixture."
          timeout --signal=TERM --kill-after=30s 20m \
            uv run pytest \
              tests/test_benchmark_corpus.py::test_corpus_live_baseline \
              -s -vv -x --junitxml=live-corpus-junit.xml
      - name: Retain live corpus evidence
        if: >-
          always() &&
          (
            (
              github.event_name == 'workflow_dispatch' &&
              (
                inputs.scope == 'live-lightweight' ||
                inputs.scope == 'bounded-independent'
              )
            ) ||
            github.event.schedule == '47 6 1 * *'
          )
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-corpus-${{ github.run_id }}
          path: |
            live-corpus-results.json
            live-corpus-junit.xml
            corpus-readiness.json
            live-uat-data/repoauditor.db
          retention-days: 30
          if-no-files-found: warn
      - name: Run split-phase CVE-positive pair
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.scope == 'cve-positive-pyjwt' ||
            inputs.scope == 'cve-positive-simple-git' ||
            inputs.scope == 'cve-positive-reposilite' ||
            inputs.scope == 'cve-positive-ruby-saml' ||
            inputs.scope == 'cve-positive-aiohttp' ||
            inputs.scope == 'cve-positive-aiohttp-continuation'
          )
        timeout-minutes: 22
        env:
          REPOAUDITOR_CVE_POSITIVE_PAIR: >-
            ${{
              inputs.scope == 'cve-positive-reposilite' &&
              'reposilite_cve_2024_36116' ||
              inputs.scope == 'cve-positive-aiohttp' &&
              'aiohttp_cve_2024_23334' ||
              inputs.scope == 'cve-positive-aiohttp-continuation' &&
              'aiohttp_cve_2024_23334' ||
              inputs.scope == 'cve-positive-ruby-saml' &&
              'ruby_saml_cve_2025_25291_25292' ||
              inputs.scope == 'cve-positive-simple-git' &&
              'simple_git_cve_2026_28292' ||
              'pyjwt_cve_2022_29217'
            }}
          REPOAUDITOR_UAT_RESULTS: live-cve-positive-results.json
          REPOAUDITOR_UAT_SCANNER_COVERAGE: not-installed-live-model-only
          REPOAUDITOR_UAT_MAX_BATCHES: "2"
          REPOAUDITOR_UAT_DATA_DIR: live-cve-positive-data
          REPOAUDITOR_CVE_CONTINUATION_RESULTS: >-
            ${{
              inputs.scope == 'cve-positive-aiohttp-continuation' &&
              'retained-aiohttp-baseline/live-cve-positive-results.json' ||
              ''
            }}
        run: |
          echo "CVE-positive pair: $REPOAUDITOR_CVE_POSITIVE_PAIR, pre-fix then post-fix."
          echo "Phase 1 executes the normal bounded production screen under its own unchanged budget."
          echo "Phase 2 runs only the applicable OWASP lens on the frozen target, then target-file-scoped falsification under a fresh unchanged budget."
          echo "Forced target inclusion receives no production coverage credit; unrelated output remains unadjudicated."
          if [[ -n "$REPOAUDITOR_CVE_CONTINUATION_RESULTS" ]]; then
            echo "Continuation qualified: reusing frozen pre-fix production/target-detection checkpoints from run 30383181253."
          fi
          echo "Hard timeout: 20 minutes; at most 2 linked batches per snapshot."
          timeout --signal=TERM --kill-after=30s 20m \
            uv run pytest tests/test_cve_positive_live.py::test_cve_positive_live_pair \
              -s -vv --junitxml=live-cve-positive-junit.xml
      - name: Retain CVE-positive pilot evidence
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.scope == 'cve-positive-pyjwt' ||
            inputs.scope == 'cve-positive-simple-git' ||
            inputs.scope == 'cve-positive-reposilite' ||
            inputs.scope == 'cve-positive-ruby-saml' ||
            inputs.scope == 'cve-positive-aiohttp' ||
            inputs.scope == 'cve-positive-aiohttp-continuation'
          )
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-cve-positive-${{ github.run_id }}
          path: |
            live-cve-positive-results.json
            live-cve-positive-junit.xml
            corpus-readiness.json
            live-cve-positive-data/repoauditor.db
          retention-days: 30
          if-no-files-found: warn
      - name: Retain manufactured-control evidence
        if: always() && hashFiles('manufactured-sentinels.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manufactured-sentinels-${{ github.run_id }}
          path: manufactured-sentinels.json
          retention-days: 30
          if-no-files-found: warn
