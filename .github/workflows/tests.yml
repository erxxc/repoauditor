name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: fast / required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - run: uv run pytest -m "not integration and not live"

  integration:
    name: integration / scanners-calibration-charts
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: uv sync --frozen --dev
      - name: Install pinned scanner binaries
        run: |
          uv tool install semgrep==1.170.1
          uv tool install pip-audit==2.10.1
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
      - name: Verify scanner availability
        run: |
          semgrep --version
          pip-audit --version
          gitleaks version
          osv-scanner --version
      - run: uv run pytest -m "integration and not live"
