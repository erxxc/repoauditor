name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: fast / required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - run: uv run pytest -m "not integration and not live and not local_evidence"

  scanner-deployment:
    name: scanner deployment / required
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false
      - run: uv sync --frozen --dev
      - name: Install pinned scanner binaries
        run: |
          uv tool install semgrep==1.170.1
          uv tool install pip-audit==2.10.1
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
      - name: Record scanner binary versions
        run: |
          {
            semgrep --version
            pip-audit --version
            gitleaks version
            osv-scanner --version
          } | tee scanner-versions.txt
      - name: Require scanner controls and provenance
        run: >-
          uv run repoauditor scanner-canaries
          --output scanner-canaries.json
      - name: Publish scanner deployment evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Required scanner deployment gate"
            echo ""
            echo "Positive, clean/not-applicable, target-count, output-schema,"
            echo "binary-version, configuration, and advisory provenance controls"
            echo "must all pass. Canary findings never enter product storage."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f scanner-canaries.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat scanner-canaries.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No canary report was produced; the gate is disqualified." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain scanner deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-deployment-${{ github.run_id }}
          path: |
            scanner-canaries.json
            scanner-versions.txt
          retention-days: 30
          if-no-files-found: warn

  integration:
    name: integration / scanners-calibration-charts
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
      - run: uv sync --frozen --dev
      - name: Install pinned scanner binaries
        run: |
          uv tool install semgrep==1.170.1
          uv tool install pip-audit==2.10.1
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
      - name: Verify scanner availability
        run: |
          semgrep --version
          pip-audit --version
          gitleaks version
          osv-scanner --version
      - run: uv run pytest -m "integration and not live"
