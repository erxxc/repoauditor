name: public corpus cache

on:
  schedule:
    # Refresh weekly so GitHub's cache eviction policy does not make every UAT a cold start.
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-corpus-cache
  cancel-in-progress: false

jobs:
  materialize:
    name: corpus / pinned acquisition and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Audit checked-in corpus policy without network access
        run: >-
          python tests/fixtures/audit_corpus_readiness.py
          --output corpus-readiness-before-materialization.json

      - name: Restore pinned public snapshots
        id: corpus-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            tests/fixtures/independent_*/snapshot
            tests/fixtures/anchor_owasp_*/snapshot
            tests/fixtures/acquisition_cve_*/snapshot
          key: public-corpus-v2-${{ runner.os }}-${{ hashFiles('tests/fixtures/materialize_public_corpus.py', 'tests/fixtures/independent_*/expected_findings.json', 'tests/fixtures/anchor_owasp_*/expected_findings.json', 'tests/fixtures/cve_positive_acquisition_cohort.json') }}

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Materialize exact commits on cache miss
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: >-
          python tests/fixtures/materialize_public_corpus.py
          "$RUNNER_TEMP/public-corpus-clones"
          --include-cve-positive-acquisition
          --fetch

      - name: Install locked test environment
        run: uv sync --frozen --dev

      - name: Require the protected holdout snapshots
        run: >-
          python tests/fixtures/audit_corpus_readiness.py
          --require-materialized
          --require-cve-positive-materialized
          --output corpus-readiness.json

      - name: Verify corpus provenance, pairs, citations, and negative controls
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          uv run pytest \
            tests/test_benchmark_corpus.py::test_benchmark_corpus_is_present \
            tests/test_benchmark_corpus.py::test_corpus_fixture_is_well_formed \
            tests/test_benchmark_corpus.py::test_independent_corpus_has_eight_real_projects_with_pre_post_pairs \
            tests/test_benchmark_corpus.py::test_corpus_kinds_keep_fixtures_and_benchmarks_out_of_independent_gate \
            tests/test_benchmark_corpus.py::test_all_new_public_entries_are_pinned_acquisition_only \
            tests/test_benchmark_corpus.py::test_protected_holdout_is_one_complete_independent_pre_post_pair \
            tests/test_benchmark_corpus.py::test_offline_corpus_readiness_is_metadata_complete_and_network_free \
            --junitxml=public-corpus-results.xml

      - name: Record cache evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Public corpus cache"
            echo ""
            echo "- Cache hit: ${{ steps.corpus-cache.outputs.cache-hit == 'true' }}"
            echo "- Materialized fixture-tree size: \`$(du -sh tests/fixtures | cut -f1)\`"
            echo "- Upstream source was archived only; no snapshot code was executed."
          } >> "$GITHUB_STEP_SUMMARY"
          du -sh tests/fixtures/*/snapshot 2>/dev/null || true

      - name: Upload integrity-test result
        if: always() && hashFiles('public-corpus-results.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-corpus-integrity-${{ github.run_id }}
          path: |
            public-corpus-results.xml
            corpus-readiness-before-materialization.json
            corpus-readiness.json
          retention-days: 30
          if-no-files-found: error
