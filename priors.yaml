# priors.yaml — exact, auditable distribution inputs for analyze/risk_quant.py.
#
# EPSS and KEV do not appear as proxy bands here. No live/cached enrichment exists yet,
# so every finding uses the explicitly labelled industry baseline below. A future CVE
# enrichment layer may add actual, dated EPSS probabilities and KEV membership, but must
# never infer either from severity.

triage:
  global_actionable_prior:
    alpha: 3.0
    beta: 7.0
    source: "SME-calibrated cold-start; retained for triage validity pending hierarchical-prior work"
    detail: "Beta(3,7): mean 0.30 and effective sample size 10."

magnitude:
  industry_baseline:
    median_usd: 259000
    p95_usd: 52000000
    source: "Cyentia Institute, Information Risk Insights Study 2022, Table 3"
    publication: "Information Risk Insights Study"
    edition: "2022"
    locator: "Table 3: Loss magnitude summary statistics, report page 12 (PDF page 11)"
    url: "https://www.cyentia.com/wp-content/uploads/IRIS-2022_Cyentia.pdf"
    transformation: "Fit Lognormal(mu,sigma) with published median=exp(mu) and published p95=exp(mu+z_0.95*sigma); model-implied p05=exp(mu-z_0.95*sigma)."
    detail: "All-event, all-sector baseline: 1,893 publicly recorded loss events; amounts inflation-adjusted by the study. It is not category- or organization-specific."

frequency:
  industry_baseline:
    annual_probability_at_least_one: 0.129
    source: "Cyentia Institute, Information Risk Insights Study 2022, Figure 4"
    publication: "Information Risk Insights Study"
    edition: "2022"
    locator: "Figure 4: Upper-bound observed and modeled annualized loss event frequency, report page 9 (PDF page 7)"
    url: "https://www.cyentia.com/wp-content/uploads/IRIS-2022_Cyentia.pdf"
    transformation: "Conditional Poisson rate lambda=-ln(1-p), using published modeled P(N>=1)=0.129 for a one-year horizon."
    detail: "All-event industry baseline for organizations over $10M revenue; upper-bound model. Used because no organization-specific frequency or real CVE EPSS/KEV enrichment exists."
