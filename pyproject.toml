[project]
name = "repoauditor"
version = "0.1.0"
description = "CLI pipeline for auditing acquired codebases: architecture/trust-boundary mapping, multi-lens AI-assisted vulnerability detection with a falsification pass, and dual-projection reporting from one findings store."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "erxxc" }]

dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "gitpython>=3.1.58",
    "anthropic>=0.40",
    # triage/ + analyze/risk_quant.py. Classical ML + numerics only — no deep
    # learning (a CLAUDE.md constraint): scikit-learn, XGBoost, NumPy, SciPy,
    # matplotlib, and shap for feature attribution.
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "shap>=0.44",
    # shap pulls in numba; floor it so the resolver picks a modern wheel rather than
    # backtracking to an ancient build that only supports Python <3.10.
    "numba>=0.60",
    # detect/retrieval multi-language AST indexing. tree-sitter is the runtime; the
    # language-pack bundles the JS/TS/Java/Ruby (+ many more) grammars in one wheel, so
    # adding a language is a dispatch-table entry, not a new dependency. Files in
    # languages with no wired grammar fall back to lexical indexing (logged, never a gap).
    # 0.26.0 corrupts TypeScript node coordinates and can segfault while walking a
    # valid Juice Shop source file; 0.25.2 is verified against that pinned corpus.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=1.13",
]

[project.scripts]
repoauditor = "repoauditor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repoauditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
addopts = "-ra"
markers = [
    "integration: exercises real scanner binaries, full calibration, or chart rendering.",
    "live: hits the real Anthropic API (opt in with REPOAUDITOR_LLM=live). Deselected by default.",
    "instrument: manufactured-solution instrument qualification control.",
    "local_evidence: validates retained evidence in the git-ignored local data tree.",
]
